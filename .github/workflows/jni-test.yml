name: JNI Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jni:
    name: JNI end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build native library (host)
        run: cargo build --release

      - name: Compile Java
        run: |
          mkdir -p out
          javac -d out \
            java/src/main/java/com/rapz/n3xr/*.java \
            java/src/test/java/com/rapz/n3xr/*.java

      - name: Run JNI test and benchmark
        run: java -Djava.library.path=target/release -cp out com.rapz.n3xr.BenchMain

      - name: Package test jar
        run: |
          printf 'Main-Class: com.rapz.n3xr.BenchMain\n' > manifest.txt
          jar cfm n3xr-bench.jar manifest.txt -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: n3xr-bench-jar
          path: n3xr-bench.jar
          if-no-files-found: error