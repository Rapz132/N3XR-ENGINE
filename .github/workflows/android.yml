
name: N3XR Engine Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi24-clang

          - abi: arm64-v8a
            target: aarch64-linux-android
            linker: aarch64-linux-android24-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" --install "ndk;27.2.12479018"

      - name: Configure Android Linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          TARGET_KEY=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          LINKER="$TOOLCHAIN/${{ matrix.linker }}"

          if [ ! -x "$LINKER" ]; then
            echo "Android linker not found: $LINKER"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${TARGET_KEY}_LINKER=$LINKER" >> "$GITHUB_ENV"

          echo "Using linker: $LINKER"
          echo "Cargo target key: CARGO_TARGET_${TARGET_KEY}_LINKER"

      - name: Build Engine
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Engine Library
        uses: actions/upload-artifact@v4
        with:
          name: N3XR-Engine-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/libn3xr_engine.so
