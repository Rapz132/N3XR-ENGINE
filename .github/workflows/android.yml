
name: N3XR Engine Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi24-clang

          - abi: arm64-v8a
            target: aarch64-linux-android
            linker: aarch64-linux-android24-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure NDK linker
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "CARGO_TARGET_${{ matrix.target }}_LINKER=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.linker }}" >> $GITHUB_ENV

      - name: Build Engine
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Engine Library
        uses: actions/upload-artifact@v4
        with:
          name: N3XR-Engine-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/libn3xr_engine.so
